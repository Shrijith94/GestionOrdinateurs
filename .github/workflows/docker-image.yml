name: CI/CD Docker GestionOrdinateurs

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOCKER_ACCOUNT: ${{ secrets.DOCKER_ACCOUNT }}

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore

      - name: Run tests
        run: dotnet test GestionOrdinateurs.Tests/GestionOrdinateurs.Tests.csproj --no-build --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: tests
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build AuthentificationApi
        run: docker build -t "${{ env.DOCKER_ACCOUNT }}/authentificationapi:latest" -f AuthentificationApi/DockerFile .

      - name: Push AuthentificationApi
        run: docker push "${{ env.DOCKER_ACCOUNT }}/authentificationapi:latest"

      - name: Build GestionOrdinateurs API
        run: docker build -t "${{ env.DOCKER_ACCOUNT }}/gestionordinateurs-api:latest" -f GestionOrdinateurs.API/DockerFile .

      - name: Push GestionOrdinateurs API
        run: docker push "${{ env.DOCKER_ACCOUNT }}/gestionordinateurs-api:latest"

      - name: Build Gateway
        run: docker build -t "${{ env.DOCKER_ACCOUNT }}/gestionordinateurs-gateway:latest" -f GestionOrdinateurs.Gateway/DockerFile .

      - name: Push Gateway
        run: docker push "${{ env.DOCKER_ACCOUNT }}/gestionordinateurs-gateway:latest"

      - name: Build Client Blazor
        run: docker build -t "${{ env.DOCKER_ACCOUNT }}/gestionordinateurs-client:latest" -f GestionOrdinateurs.Client/DockerFile .

      - name: Push Client Blazor
        run: docker push "${{ env.DOCKER_ACCOUNT }}/gestionordinateurs-client:latest"
